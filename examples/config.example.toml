# 전역 설정 예시 (PROJECT-PLAN §6.1, §21.10). Docker 에서는 /config/config.toml.
# 설정은 시작할 때 한 번 읽는다. 공급자를 바꾸려면 이 파일을 고치고 재기동한다 (폴백 없음).
# API 키는 이 파일에 쓰지 않는다. 웹 Settings 의 키 탭에서 넣는다 (데이터 폴더 secrets.toml).

[llm]
provider = "nim"                   # nim(기본) | local | ollama | openrouter | openai | claude | gemini

[providers.nim]
base_url = "https://integrate.api.nvidia.com/v1"
model = "deepseek-ai/deepseek-v4.1-flash"   # M0 실측으로 고른 기본 모델
pass1_model = ""                   # 비우면 model 사용
rpm = 30
concurrency = 1
timeout = 300                      # 초. 무료 엔드포인트가 혼잡하면 큰 요청이 120초를 넘는다
temperature = 0.2
response_format = "json_schema"    # M0: NIM 은 guided_json(nvext)을 거부한다
extra_body = { chat_template_kwargs = { enable_thinking = false } }   # M0: 기본 thinking 켜짐

[providers.local]
base_url = "http://llm-host:8080/v1"          # 별도 기동한 llama-server 주소
model = "Qwen3.8-27B-UD-Q4_K_XL"   # 기대 모델. 서버에 로드된 모델과 다르면 경고
pass1_model = ""
rpm = 0                            # 0 = 제한 없음
concurrency = "auto"               # /props 의 슬롯 수 사용
timeout = 600
temperature = 0.2
response_format = "json_schema"
extra_body = { chat_template_kwargs = { enable_thinking = false } }

# 아래 공급자는 모델 기본값이 없다: 고른 공급자의 model 을 반드시 적는다 (웹 Settings 의 "모델 목록"으로 고를 수 있다).
# base_url·timeout 은 기본값이 있어 생략해도 된다 (PROJECT-PLAN §27). 키는 Settings 에서
# [providers.ollama]                 # 고유 API /api/chat, 키 없이 (프록시 뒤면 Settings 에 키)
# base_url = "http://127.0.0.1:11434"
# model = "qwen3:32b"
# context_tokens = 8192              # num_ctx. 모델 최대값보다 크면 줄인다
# extra_body = { think = false }     # 생각(thinking) 모델일 때
#
# [providers.openrouter]             # 키는 Settings
# model = "<공급자/모델>"
#
# [providers.openai]                 # 키는 Settings. temperature 를 적지 않으면 보내지 않는다
# model = "<모델>"
# auth = "subscription"              # ChatGPT 구독: Codex CLI 실행
#
# [providers.claude]                 # 키는 Settings. Messages API, 도구 호출로 구조화 출력
# model = "<모델>"
# auth = "subscription"              # 구독 계정: Claude Code CLI 실행 (model = "sonnet" 등 별칭)
#
# [providers.gemini]                 # 키는 Settings. OpenAI 호환 엔드포인트
# model = "<모델>"
# auth = "subscription"              # Google 계정 구독: Gemini CLI 실행

[translation]
target_language = "ko"             # 번역 대상 언어 (ISO 639-1: ko, en, fr …). CLI 는 --target

[retry]
max_retries_unit = 2
max_retries_batch = 3

# 미디어 확장 (PROJECT-PLAN §21.10)
[watch]
enabled = true
scan_existing = true                 # 기존 라이브러리 백로그 자동 처리
backlog_order = "newest"             # newest(최근 수정순) | path
backlog_skip_if_external = true      # 백로그는 외부 자막이 있으면 건너뜀
reconcile_interval = 900             # 초, 이벤트를 놓친 파일을 찾는 주기 스캔
stable_seconds = 60                  # 크기·mtime 이 이만큼 그대로여야 처리 (복사 중 보호)
polling = false                      # NFS·SMB 처럼 inotify 가 안 되는 마운트는 true
polling_interval = 30                # 초, polling 이 폴더 전체를 훑는 간격 (짧으면 큰 라이브러리에 부하)
include = ["*.mkv", "*.mp4"]
exclude = ["*.part", "*.!qB", "*.tmp", "*sample*"]
exclude_dirs = ["_UNPACK_*", "_FAILED_*"]   # 이 이름의 폴더 안은 감시 안 함 (SABnzbd 가 압축을 푸는 중인 폴더)

[[watch.paths]]
path = "/media/movies"
kind = "movie"                       # movie | series | auto(파일명에 S01E01 등이 있으면 시리즈)

[[watch.paths]]
path = "/media/tv"
kind = "series"

[media]
extract_langs = ["en", "ja", "ko"]   # 사이드카로 추출할 언어 (번역 여부와 무관). 대상 언어·원어 트랙은 늘 추출
# 번역 소스: 작품 원어(TMDB, [tmdb]) 트랙 → 없으면 첫 텍스트 트랙 (대상 언어 트랙 제외)
skip_forced = true                   # forced·Signs/Songs 트랙은 소스로 쓰지 않음
target_image_counts = true           # 대상 언어 이미지 자막만 있어도 '대상 언어 자막 있음' (옛 이름 korean_image_counts)
output_mode = "sidecar"              # sidecar | mirror
output_format = "srt"                # 번역 사이드카: srt | ass(ASS 트랙이면 .<대상>.ass) | both
output_root = "/output"              # mirror 모드에서만 사용
series_window = 600                  # 초, 시리즈 배치 창
tool_priority = "low"                # 검사·추출 도구: low(ionice idle·nice 19, 다운로드 등에 양보) | normal

[sidecar]
on_conflict = "rename"               # rename(기존 파일을 .orig 로 보존) | skip
rename_style = "orig"                # orig: Movie.en.orig.srt | backup: Movie.en.srt.orig

[queue]
workers = 1                          # 서로 다른 작업을 병렬 처리 (같은 시리즈는 한 번에 하나)
max_attempts = 5                     # 실패 재시도 상한, 이후 failed (queue retry 로 재실행)

[ledger]
hash_bytes = 4194304                 # 영상 식별: 앞·뒤 각각 해시할 바이트 수
restore_missing_outputs = true       # 이동된 영상에 보관본 사이드카 복원

# 웹 화면 (PROJECT-PLAN §25). 토큰은 환경 변수 SUBTITLE_ROBOT_WEB_TOKEN 으로만 받는다 (없으면 켜지 않는다)
[tmdb]
# 동영상의 원어(original language)를 TMDB 로 찾아 그 언어의 자막 트랙을 번역 소스로 쓴다 (§26.6).
# 키(v3 API 키 또는 v4 읽기 토큰)는 환경 변수로만 준다. 없으면 첫 자막 트랙을 쓴다
enabled = true
timeout = 10

[web]
enabled = true
host = "0.0.0.0"                     # 컨테이너 밖에서 접속한다
port = 8949
session_hours = 168                  # 로그인 유지 시간
